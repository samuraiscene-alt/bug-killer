<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2b222e"><title>Bug Killer — Rig Lab v0.5.0</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211b27;color:white;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}.top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:9px max(14px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-weight:1000;font-size:clamp(18px,3.2vw,30px);text-shadow:0 2px 5px #3e342f}.brand span{color:#ffcc65}.top small{display:block;font-size:10px;color:#665249;text-shadow:none}.stateText{color:#664332;text-align:right;background:#fff5debf;border-radius:10px;padding:7px 10px;font-weight:800;font-size:12px;text-shadow:none}.panel{position:fixed;bottom:max(env(safe-area-inset-bottom),7px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 8px);padding:7px;background:#2b2332ee;border:1px solid #fff3;border-radius:17px;display:flex;gap:7px;align-items:center;box-shadow:0 6px 28px #0006}.panel button{border:1px solid #816f8a;border-radius:10px;background:#463b50;color:white;font-size:clamp(10px,1.6vw,13px);padding:10px 11px;font-weight:800;white-space:nowrap}.panel button.on{background:#f4cf78;color:#382a2d;border-color:#ffdf8b}.panel .sep{width:1px;background:#77697b;align-self:stretch;flex-shrink:0}.notice{position:fixed;top:15%;left:50%;transform:translateX(-50%);font-size:clamp(10px,1.6vw,13px);font-weight:800;color:#77533e;background:#fff1dbcc;padding:6px 14px;border-radius:12px;white-space:nowrap}.rotate{display:none;position:fixed;inset:0;background:#211b27;z-index:10;place-items:center;text-align:center;font-size:22px;font-weight:800}@media(orientation:portrait){.rotate{display:grid}}@media(max-height:380px){.panel{padding:4px;gap:4px}.panel button{padding:6px}.notice{top:18%}}
</style></head><body><canvas id="stage"></canvas><div class="top"><div class="brand">BUG <span>KILLER</span><small>3 CHARACTER RIG LAB · v0.5.0</small></div><div id="label" class="stateText">파리 · 정상 · 벽 대기</div></div><div id="notice" class="notice">표정을 바꾸고, 이륙과 착지 동작을 비교하세요</div><div class="panel" id="buttons"><button data-bug="fly" class="on">파리</button><button data-bug="mosquito">모기</button><button data-bug="roach">바퀴벌레</button><div class="sep"></div><button data-health="normal" class="on">정상</button><button data-health="light">경상</button><button data-health="heavy">중상</button><button data-health="dead">사망</button><div class="sep"></div><button data-motion="fly">이륙·비행</button><button data-motion="walk">벽 이동</button><button data-motion="stop" class="on">정지</button></div><div class="rotate">↻<br>가로 화면으로 돌려주세요</div><script>
(()=>{'use strict';
const canvas=document.querySelector('#stage'),c=canvas.getContext('2d');const $=s=>document.querySelector(s);let W,H,D=1,tm=0,last=0;let kind='fly',health='normal',motion='stop',phase='stop',phaseT=0;let flyX=0,flyY=0,flyZ=0,angle=0,oldX=0,oldY=0;const PI=Math.PI,TAU=PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>(t=clamp(t,0,1),t*t*(3-2*t));
const species={fly:{name:'파리',body:'#59505e',head:'#625560',light:'#7b6979',eye:'#e65359',stripe:'#a29dad',wing:'#c7e9f3'},mosquito:{name:'모기',body:'#6d5966',head:'#7b616b',light:'#a58b9d',eye:'#ec7850',stripe:'#d15360',wing:'#d6edf6'},roach:{name:'바퀴벌레',body:'#67453b',head:'#80584a',light:'#9b7160',eye:'#f6a43e',stripe:'#d4c6ba',wing:'#b58a6e'}};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0);if(!flyX){flyX=W*.5;flyY=H*.51}}addEventListener('resize',resize);resize();
function ellipse(x,y,rx,ry,fill,stroke='#302833',width=3){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function line(a,b,d,col='#31292f',width=5){c.beginPath();c.moveTo(...a);c.lineTo(...b);if(d)c.lineTo(...d);c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;c.lineWidth=width;c.stroke()}
function arcPath(x,y,rx,ry,a,b,color,w){c.beginPath();c.ellipse(x,y,rx,ry,0,a,b);c.strokeStyle=color;c.lineWidth=w;c.lineCap='round';c.stroke()}
function rounded(x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function star(x,y,r){c.beginPath();for(let i=0;i<10;i++){let a=i*PI/5-PI/2,rad=i%2?r*.44:r;i?c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad):c.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fillStyle='#ffdf60';c.fill();c.strokeStyle='#8d592c';c.lineWidth=1.4;c.stroke()}
function background(){const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f0e0c5');g.addColorStop(.75,'#dac3a6');g.addColorStop(1,'#c2a27f');c.fillStyle=g;c.fillRect(0,0,W,H);c.strokeStyle='#b5997350';c.lineWidth=1.6;for(let x=W*.2;x<W;x+=W*.38){c.beginPath();c.moveTo(x,0);c.lineTo(x,H-35);c.stroke()}for(let y=H*.38;y<H-40;y+=H*.27){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.fillStyle='#a9896c';c.fillRect(0,H-33,W,33);c.fillStyle='#f0d7b8';c.fillRect(0,H-39,W,6);const g2=c.createRadialGradient(W*.52,H*.38,10,W*.52,H*.38,W*.65);g2.addColorStop(0,'#fff8d342');g2.addColorStop(1,'#fff6d300');c.fillStyle=g2;c.fillRect(0,0,W,H)}
function wing(side,s,flap,broken){c.save();c.translate(side*28,-28);c.rotate(side*(.14+flap*.65));const pal=species[kind];c.beginPath();c.moveTo(0,0);c.bezierCurveTo(side*12,-65,side*42,-120,side*84,-112);c.bezierCurveTo(side*116,-92,side*90,-55,side*50,-20);c.bezierCurveTo(side*20,0,side*15,5,0,0);c.closePath();c.fillStyle=pal.wing+'bc';c.strokeStyle='#637987';c.lineWidth=3;c.fill();c.stroke();line([0,0],[side*45,-58],[side*83,-106],'#849ba9',1.8);line([side*20,-37],[side*72,-61],null,'#849ba9',1.5);if(broken){line([side*70,-95],[side*54,-78],[side*85,-75],'#5d5860',3)}c.restore()}
function antennae(side,damaged){let wig=Math.sin(tm*2.8+side)*3;if(kind==='roach'){c.beginPath();c.moveTo(side*22,-81);c.quadraticCurveTo(side*39,-145,side*(82+wig),-167);c.strokeStyle='#36292b';c.lineWidth=3;c.stroke()}else if(kind==='mosquito'){c.beginPath();c.moveTo(side*15,-91);c.quadraticCurveTo(side*(37+wig),-115,side*58,-142);c.strokeStyle='#342a33';c.lineWidth=2.7;c.stroke();for(let i=1;i<5;i++){let u=i/5;line([side*(15+43*u),-91-51*u],[side*(17+43*u),-102-51*u],null,'#3d3039',1.6)}}else{line([side*19,-85],[side*(28+wig),-111],[side*35,-116],'#342b36',3.2)}}
// Each upper/lower limb is independently pivoted at its joint.
function arm(side,pose,inj){const shoulder=[side*45,-7],upperLen=39,lowerLen=34;let upperAngle=side*(.95+Math.sin(tm*1.6+side)*.11);if(pose==='air')upperAngle=side*.65;if(inj==='dead')upperAngle=side*1.62;const elbow=[shoulder[0]+Math.sin(upperAngle)*upperLen,shoulder[1]-Math.cos(upperAngle)*upperLen];let wrist=[elbow[0]+side*lowerLen*.88,elbow[1]-(pose==='air'?4:19)+Math.sin(tm*1.7+side)*2];if(inj==='dead')wrist=[elbow[0]+side*11,elbow[1]+24];line(shoulder,elbow,null,'#29252b',17);line(shoulder,elbow,null,species[kind].head,11);ellipse(elbow[0],elbow[1],8,8,species[kind].head);line(elbow,wrist,null,'#2d272d',14);line(elbow,wrist,null,species[kind].light,9);ellipse(wrist[0],wrist[1],9,8,species[kind].head);for(let i=-1;i<=1;i++){let y=wrist[1]+i*6;line([wrist[0],wrist[1]],[wrist[0]+side*(11+Math.sin(tm*2+i)*1.8),y],null,'#332b30',4)}}
function leg(side,index,pose,inj){const base=[side*(19+index*9),59+index*10],flight=pose==='air',walking=pose==='walk';let p=Math.sin(tm*(inj==='heavy'?3:5)+index*PI+(side>0?PI:0));let thigh=[side*(48+index*7)+(walking?p*2.8:0),83+index*9],shin=[side*(64+index*9)+(walking?p*5:0),118+index*8-(walking?Math.max(0,p)*4:0)];if(flight){thigh=[side*(34+index*5),84+index*8];shin=[side*(35+index*5),103+index*8]}if(inj==='dead'){thigh=[side*(45+index*5),93+index*6];shin=[side*(57+index*4),117+index*7]}line(base,thigh,null,'#30282d',13);line(base,thigh,null,species[kind].head,9);ellipse(thigh[0],thigh[1],7.5,7.5,species[kind].light);line(thigh,shin,null,'#30282d',9);line(thigh,shin,null,species[kind].light,5);ellipse(shin[0],shin[1],4.2,4.2,species[kind].head)}
function brows(side,state){const x=side*24,y=-59,raise=state==='normal'?-5:state==='light'?3:8;c.save();c.translate(x,y+raise);c.rotate(side*(state==='normal'?.18:-.08));rounded(-25,-10,49,17,8,species[kind].head,'#34292e');c.restore()}
function eye(side,state){const x=side*23,y=-42;const b=state==='light'?3:state==='heavy'?8:0;ellipse(x,y,24+b*.5,22+b*.35,state==='heavy'?'#805762':species[kind].eye);if(state==='dead'){line([x-12,y],[x+12,y],null,'#372b31',5);arcPath(x,y-2,15,7,0,PI,'#4b3539',3);return}c.save();c.beginPath();c.ellipse(x,y,20+b*.25,17+b*.25,0,0,TAU);c.clip();ellipse(x,y,'10','10','#fff5ed');let look=state==='normal'?Math.sin(tm*1.25)*4:Math.sin(tm*.65)*2;let blink=Math.max(0,1-Math.abs(Math.sin(tm*.8+side))*60);ellipse(x+look+side*3,y+2,7,9,'#a64c24');ellipse(x+look+side*3,y+2,4,6,'#2d2530');ellipse(x+look+side*2,y,2,2,'white',null);if(blink>0)rounded(x-24,y-23,48,47*blink,1,species[kind].head);c.restore();if(state==='light'||state==='heavy'){arcPath(x,y+13,24,12,0,PI,'#785364',state==='heavy'?9:5);if(state==='heavy')ellipse(x+side*10,y+19,13,7,'#a76b79',null)}}
function mouth(state){if(state==='normal'){c.beginPath();c.moveTo(-35,-7);c.quadraticCurveTo(0,45,36,-7);c.quadraticCurveTo(0,8,-35,-7);c.closePath();c.fillStyle='#21191e';c.fill();c.strokeStyle='#33252a';c.lineWidth=3;c.stroke();ellipse(0,7,16,7,'#9c3e45',null);for(let i of [-2,-1,0,1,2]){c.beginPath();c.moveTo(i*12,-5);c.lineTo(i*12+5,4);c.lineTo(i*12+9,-5);c.fillStyle='#fff8ed';c.fill()}}else if(state==='light'){line([-16,0],[0,3],[17,0],'#31252b',4)}else if(state==='heavy'){c.beginPath();c.moveTo(-14,6);c.quadraticCurveTo(0,-1,14,8);c.strokeStyle='#3b2a32';c.lineWidth=5;c.stroke()}else{line([-13,4],[13,4],null,'#352b2c',4)}}
function head(state){c.save();let nod=state==='dead'?0:Math.sin(tm*(motion==='walk'?3:.9))*.02;c.translate(0,-39);c.rotate(nod);ellipse(0,-29,58,49,species[kind].head);ellipse(-19,-41,18,10,'#fff3ed20',null);for(let s of [-1,1]){antennae(s,state==='dead');eye(s,state);brows(s,state)}mouth(state);if(kind==='mosquito'){c.save();c.rotate(state==='dead'?.25:Math.sin(tm*.8)*.018);line([0,-16],[-7,18],[-32,71],'#3e2932',11);line([0,-16],[-7,18],[-32,71],'#bc8fa6',7);if(state==='heavy'||state==='dead'){line([-32,71],[-45,81],null,'#bd95a3',7)}c.restore()}c.restore()}
function torso(){const spec=species[kind];ellipse(0,46,48,77,spec.body);if(kind==='mosquito'){ellipse(0,73,29,58,'#a84050');for(let i=0;i<4;i++)arcPath(0,37+i*16,27,18,.16,PI-.16,'#632c38',3)}else if(kind==='roach'){ellipse(0,43,40,72,spec.stripe);for(let i=0;i<4;i++)arcPath(0,-9+i*25,39,35,.20,PI-.20,'#7d6c67',4)}else{ellipse(0,40,34,59,'#777483');for(let i=0;i<4;i++)arcPath(0,0+i*23,32,28,.18,PI-.18,'#4d4653',4)}ellipse(0,-4,46,48,spec.head);ellipse(-13,-23,24,18,'#fff8f017',null)}
function wound(state){if(state==='light'||state==='heavy'){c.save();c.translate(15,45);c.rotate(-.18);rounded(-23,-10,46,20,6,'#edd4a4','#a68b66');for(let i=-1;i<=1;i++)ellipse(i*7,0,1.7,1.8,'#b08b70',null);c.restore()}if(state==='heavy'){c.save();c.rotate(-.07);rounded(-46,13,92,19,5,'#f5e5ce','#af9e85');for(let i=-3;i<4;i++)line([-39+i*13,13],[-35+i*13,31],null,'#c7b49b',1.4);c.restore()}if(state==='dead'){c.strokeStyle='#fdd253';c.lineWidth=5;c.beginPath();c.ellipse(0,-152,26,8,0,0,TAU);c.stroke()}}
function barsAndEffects(x,y,size){if(health==='dead')return;let ratio=health==='normal'?1:health==='light'?.57:.23;let barW=clamp(110*size,52,120);const bx=x-barW/2,by=y+138*size;c.fillStyle='#38313c';c.beginPath();c.roundRect(bx-3,by-3,barW+6,15,6);c.fill();c.fillStyle='#807881';c.fillRect(bx,by,barW,9);c.fillStyle=health==='normal'?'#32c877':health==='light'?'#f2c746':'#f05d58';c.beginPath();c.roundRect(bx,by,barW*ratio,9,3);c.fill()}
function character(){const air=phase==='takeoff'||phase==='air'||phase==='landing',p=phase==='walk'?'walk':air?'air':'stop';let sc=clamp(Math.min(W/940,H/540)*.92,.52,1.07)*(1+flyZ*.32),x=flyX,y=flyY; c.save();c.globalAlpha=.19-flyZ*.12;ellipse(x+flyZ*35,y+130*sc+flyZ*45,65*sc,12*sc,'#604c40',null);c.restore();c.save();c.translate(x,y);c.rotate(angle);c.scale(sc,sc);if(kind!=='roach'){const flap=air?Math.sin(tm*42):.06;wing(-1,sc,flap,health==='heavy'||health==='dead');wing(1,sc,-flap,health==='heavy'||health==='dead')}else{for(let s of [-1,1]){c.save();c.translate(s*35,20);c.rotate(s*.13);ellipse(0,14,22,58,'#966644');c.restore()}}for(let s of [-1,1])for(let i=0;i<3;i++)leg(s,i,p,health);torso();for(let s of [-1,1])arm(s,p,health);head(health);wound(health);if(health==='light'||health==='heavy'){for(let i=0;i<3;i++){let a=tm*2+i*TAU/3;star(Math.cos(a)*51,-137+Math.sin(a)*9,7)}}c.restore();barsAndEffects(x,y,sc)}
function startMotion(m){motion=m;phase=m==='fly'?'takeoff':m==='walk'?'walk':'stop';phaseT=0;oldX=flyX;oldY=flyY;const name=phase==='takeoff'?'이륙 준비':phase==='walk'?'벽 이동':'벽 대기';$('#notice').textContent=m==='fly'?'비행 중에는 날개, 벽에서는 다리 움직임을 확인하세요':m==='walk'?'벽에서 관절이 작게 움직입니다':'정지하면 눈과 더듬이만 조금씩 움직입니다';refresh(name)}
function refresh(st){$('#label').textContent=species[kind].name+' · '+{normal:'정상',light:'경상',heavy:'중상',dead:'사망'}[health]+' · '+(st||phase);document.querySelectorAll('[data-bug]').forEach(b=>b.classList.toggle('on',b.dataset.bug===kind));document.querySelectorAll('[data-health]').forEach(b=>b.classList.toggle('on',b.dataset.health===health));document.querySelectorAll('[data-motion]').forEach(b=>b.classList.toggle('on',b.dataset.motion===motion))}
$('#buttons').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.bug){kind=b.dataset.bug;health='normal';motion='stop';phase='stop';flyZ=0;angle=0;flyX=W*.5;flyY=H*.51;$('#notice').textContent='벌레를 선택하고 상태와 동작을 바꿔보세요'}if(b.dataset.health){health=b.dataset.health;if(health==='dead'){phase='fall';motion='stop';phaseT=0;oldY=flyY;$('#notice').textContent='눈을 감고 입을 다문 채, 뒤집히지 않고 아래로 떨어집니다'}else{$('#notice').textContent=health==='normal'?'비열한 웃음과 날카로운 눈썹':health==='light'?'눈가에 가벼운 멍, 웃음이 사라진 입':'눈과 얼굴이 심하게 붓고, 붕대와 꺾인 날개'}}if(b.dataset.motion){if(health==='dead')health='normal';startMotion(b.dataset.motion)}refresh()});
function update(dt){tm+=dt;phaseT+=dt;if(phase==='takeoff'){let k=smooth(phaseT/.8);flyZ=.66*k;flyX=lerp(oldX,W*.55,k);flyY=lerp(oldY,H*.32,k);angle=Math.sin(tm*1.3)*.025;if(k>=1){phase='air';phaseT=0}}else if(phase==='air'){flyX+=((W*(.55+.13*Math.sin(tm*.8)))-flyX)*dt*1.5;flyY+=((H*(.39+.1*Math.cos(tm*.9)))-flyY)*dt*1.5;flyZ=.68+Math.sin(tm)*.04;angle=Math.cos(tm*1.4)*.032;if(phaseT>3.4){phase='landing';phaseT=0;oldX=flyX;oldY=flyY}}else if(phase==='landing'){let k=smooth(phaseT/1.05);flyX=lerp(oldX,W*.5,k);flyY=lerp(oldY,H*.51,k);flyZ=lerp(.68,0,k);angle*=.94;if(k>=1){phase='stop';motion='stop';refresh('벽 착지')}}else if(phase==='walk'){flyX=W*.5+Math.sin(tm*.76)*W*.06;flyY=H*.51+Math.cos(tm*.55)*H*.022;angle=Math.sin(tm*1.4)*.009;flyZ=0}else if(phase==='fall'){flyY=Math.min(H-85,oldY+370*Math.pow(phaseT,1.6));flyZ=0;angle=0;if(flyY>=H-85)phase='dead'}else{flyZ*=.9;angle*=.92}if(health==='dead'){angle=0}}
function frame(ms){if(!last)last=ms;let dt=Math.min(.034,(ms-last)/1000);last=ms;update(dt);background();character();requestAnimationFrame(frame)}refresh('벽 대기');requestAnimationFrame(frame);
})();
</script></body></html>
