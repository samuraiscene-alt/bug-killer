<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#29232b"><title>Bug Killer · Fly Rig v0.4.0</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#302635;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:white;touch-action:none}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;padding:10px max(14px,env(safe-area-inset-left))}.logo{font-size:clamp(19px,3vw,30px);font-weight:1000;text-shadow:0 2px 5px #553b32;line-height:1}.logo em{font-style:normal;color:#ffcf66}.top small{display:block;font-size:10px;letter-spacing:1px;color:#fff7e2;margin-top:5px}.label{text-align:right;font-size:clamp(11px,1.7vw,15px);font-weight:800;color:#593a33;background:#fff2d9d9;padding:6px 11px;border-radius:12px}.label small{color:#765846}.controls{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;max-width:calc(100vw - 10px);padding:7px;border-radius:16px;background:#28202ddd;border:1px solid #ffffff30;box-shadow:0 6px 28px #36202d55;white-space:nowrap}button{font-family:inherit;border:1px solid #78647f;border-radius:10px;background:#44374b;color:white;padding:10px 13px;font-weight:800;font-size:clamp(11px,1.9vw,14px);touch-action:manipulation}button.active{background:#ffd36c;color:#3c3038;border-color:#ffdf9c}button:active{transform:scale(.97)}.sub{position:absolute;top:17%;left:50%;transform:translateX(-50%);background:#fff1ddda;padding:6px 14px;border-radius:12px;color:#654636;font-size:clamp(11px,1.8vw,14px);font-weight:700;text-align:center;pointer-events:none;white-space:nowrap}.rotate{display:none;position:absolute;inset:0;place-items:center;background:#26202b;text-align:center;padding:24px;font-size:22px;font-weight:800;z-index:5}@media(orientation:portrait){.rotate{display:grid}}@media(max-height:390px){.controls{padding:4px}button{padding:6px 8px}.sub{top:18%}}
</style></head><body><canvas id="stage"></canvas><div class="top"><div class="logo">BUG <em>KILLER</em><small>FLY RIG LAB · v0.4.0</small></div><div id="stateName" class="label">벽에 붙어 있음<small>날개·다리·눈 독립 애니메이션</small></div></div><div class="sub" id="desc">벽에 붙으면 다리, 비행 중에는 날개가 움직여요</div><div class="controls"><button id="demo">▶ 전체 시연</button><button id="takeoff">🪽 이륙·비행</button><button id="land">🎯 착지</button><button id="walk">🐾 벽 이동</button><button id="eyes">👀 눈 움직임</button><button id="reset">↻ 초기화</button></div><div class="rotate">↻<br>가로 화면으로 돌려주세요</div><script>
(()=>{'use strict';
const canvas=document.getElementById('stage'),c=canvas.getContext('2d'),$=s=>document.getElementById(s);let W=1,H=1,dpr=1,t=0,prev=0,phase='idle',elapsed=0,progress=0,fly={x:0,y:0,z:0,tilt:0},start={x:0,y:0},auto=false,script=0,walkTime=0,blinkBoost=0,wingOpacity=0,walkAmount=0;const TAU=Math.PI*2,clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),smooth=x=>(x=clamp(x,0,1),x*x*(3-2*x)),lerp=(a,b,f)=>a+(b-a)*f;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);c.setTransform(dpr,0,0,dpr,0,0);if(!fly.x){fly.x=W*.48;fly.y=H*.54}}addEventListener('resize',resize);resize();
function setPhase(p,label,hint){phase=p;progress=0;start={...fly};$('stateName').firstChild.textContent=label;$('desc').textContent=hint;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'))}
function select(id){$(id).classList.add('active')}
function reset(){auto=false;script=0;fly={x:W*.48,y:H*.54,z:0,tilt:0};setPhase('idle','벽에 붙어 있음','멈춰 있을 땐 눈과 더듬이만 살짝 움직입니다');select('reset')}
function takeoff(){setPhase('takeoff','이륙 중','다리를 접고 날개를 빠르게 펄럭입니다');select('takeoff')}
function land(){if(phase==='idle')return;setPhase('landing','벽에 착지','날갯짓이 줄고 다리를 펼치며 착지합니다');select('land')}
function walk(){setPhase('walking','벽에서 걷기','날개는 접고, 다리 6개가 교대로 짧게 움직입니다');select('walk')}
function eyes(){blinkBoost=1.2;setPhase('idle','눈과 표정','시선 이동과 눈 깜빡임은 별도 애니메이션입니다');select('eyes')}
$('reset').onclick=reset;$('takeoff').onclick=()=>{auto=false;takeoff()};$('land').onclick=()=>{auto=false;land()};$('walk').onclick=()=>{auto=false;walk()};$('eyes').onclick=()=>{auto=false;eyes()};$('demo').onclick=()=>{reset();auto=true;script=0;takeoff();select('demo')};
function update(dt){t+=dt;elapsed+=dt;progress+=dt;blinkBoost=Math.max(0,blinkBoost-dt);let bw=0,step=0;if(phase==='takeoff'){let k=smooth(progress/.95);fly.x=lerp(start.x,W*.54,k);fly.y=lerp(start.y,H*.32,k);fly.z=lerp(0,.64,k);fly.tilt=Math.sin(t*2)*.06;bw=1;if(progress>.95){setPhase('flying','공중 비행','날개가 펄럭이고 다리는 접어 둡니다');if(auto)select('demo')}}else if(phase==='flying'){fly.z=.68+Math.sin(t*1.4)*.08;fly.x+=((W*(.55+.12*Math.sin(t*.82)))-fly.x)*Math.min(1,dt*2.4);fly.y+=((H*(.40+.12*Math.sin(t*1.2)))-fly.y)*Math.min(1,dt*2.1);fly.tilt=Math.cos(t*1.3)*.075;bw=1}else if(phase==='landing'){let k=smooth(progress/1.1);fly.x=lerp(start.x,W*.48,k);fly.y=lerp(start.y,H*.54,k);fly.z=lerp(start.z,0,k);fly.tilt=lerp(start.tilt,0,k);bw=1-k;if(progress>=1.1){setPhase('idle','벽에 붙어 있음','착지 후 날개를 접고 눈과 더듬이만 움직입니다');if(auto)select('demo')}}else if(phase==='walking'){fly.z=0;fly.x+=Math.sin(t*.95)*dt*22;fly.y+=Math.cos(t*.82)*dt*5;fly.tilt=Math.sin(t*2)*.014;step=1;if(progress>3.2){setPhase('idle','벽에 붙어 있음','다리 걷기 종료, 벽에 정지');if(auto)select('demo')}}else{fly.tilt*=.92;fly.z*=.91}wingOpacity=lerp(wingOpacity,bw,Math.min(1,dt*10));walkAmount=lerp(walkAmount,step,Math.min(1,dt*9));if(auto){if(script===0&&phase==='flying'&&progress>3.2){script=1;land();select('demo')}else if(script===1&&phase==='idle'&&progress>1){script=2;walk();select('demo')}else if(script===2&&phase==='idle'&&progress>1.5){auto=false;script=3;eyes()}}}
function path(points,color,width=2){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke()}
function ellipse(x,y,rx,ry,fill,stroke,width=2){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function curve(fn,stroke='#2c2630',width=3){c.beginPath();fn();c.lineWidth=width;c.strokeStyle=stroke;c.lineCap='round';c.lineJoin='round';c.stroke()}
function bugWing(sign,power){c.save();c.translate(sign*27,-17);let flap=Math.sin(t*49+(sign===-1?.45:0))*power;c.rotate(sign*(.2+flap*.46));c.fillStyle='#b7dfeb'+(power>.2?'ad':'a2');c.strokeStyle='#789aab';c.lineWidth=2.5;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(sign*6,-44,sign*39,-88,sign*72,-81);c.bezierCurveTo(sign*94,-66,sign*77,-38,sign*40,-11);c.bezierCurveTo(sign*26,-3,sign*12,3,0,0);c.closePath();c.fill();c.stroke();path([[0,0],[sign*33,-42],[sign*70,-78]],'#9ac0cf',1.3);path([[sign*14,-24],[sign*51,-38]],'#9ac0cf',1.1);path([[sign*29,-41],[sign*66,-56]],'#9ac0cf',1.1);c.restore()}
function leg(sign,i,air,move){let hy=8+i*16,hx=sign*(28+i*1.8);let phase=t*9+(i%2?Math.PI:0)+(sign>0?Math.PI:0);let swing=Math.sin(phase)*move;let kneeX=sign*(48+i*5)+(air?0:swing*3),kneeY=hy+20+(air?6:Math.max(0,swing)*-2),footX=sign*(67+i*7)+(air?-sign*11:swing*5),footY=hy+54+(air?-22:-Math.max(0,swing)*4);curve(()=>{c.moveTo(hx,hy);c.quadraticCurveTo((hx+kneeX)/2,hy+12,kneeX,kneeY);c.lineTo(footX,footY)},'#2a2932',6);curve(()=>{c.moveTo(hx,hy);c.lineTo(kneeX,kneeY);c.lineTo(footX,footY)},'#7c646e',2.4);ellipse(kneeX,kneeY,3.2,3.2,'#40333b');path([[footX,footY],[footX+sign*4,footY-3]],'#362f38',2)}
function background(){let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f0debf');g.addColorStop(.7,'#dcc2a1');g.addColorStop(1,'#c9a881');c.fillStyle=g;c.fillRect(0,0,W,H);c.strokeStyle='#bc9a7040';c.lineWidth=1.5;for(let x=W*.28;x<W;x+=W*.44){c.beginPath();c.moveTo(x,0);c.lineTo(x,H-44);c.stroke()}for(let y=H*.32;y<H;y+=H*.36){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}let light=c.createRadialGradient(W*.47,H*.43,15,W*.47,H*.43,W*.65);light.addColorStop(0,'#ffeddb74');light.addColorStop(1,'#c9ab9a00');c.fillStyle=light;c.fillRect(0,0,W,H);c.fillStyle='#a98663';c.fillRect(0,H-40,W,40);c.fillStyle='#f4dbb7';c.fillRect(0,H-45,W,7);c.fillStyle='#765239';c.fillRect(0,H-13,W,13)}
function flyCharacter(){const scale=clamp(Math.min(W/870,H/490)*1.18,.68,1.37)*(1+fly.z*.33),flying=fly.z>.1||phase==='takeoff'||phase==='landing',motion=walkAmount;
c.save();c.globalAlpha=clamp(.23-fly.z*.19,.07,.25);ellipse(fly.x+fly.z*38,fly.y+118*scale+fly.z*48,70*scale*(1-fly.z*.3),12*scale,'#645344');c.restore();c.save();c.translate(fly.x,fly.y+Math.sin(t*10)*wingOpacity*2);c.rotate(fly.tilt);c.scale(scale,scale);
// Wings share thorax attachment, and flap only during flight
bugWing(-1,wingOpacity);bugWing(1,wingOpacity);
// Six coherent legs: held almost static in flight, walking only on wall
for(let side of [-1,1])for(let i=0;i<3;i++)leg(side,i,flying,walkAmount);
// abdomen: single consistent cartoon body instead of stitched stills
ellipse(0,38,38,57,'#5c4b56','#2b2630',3);ellipse(0,42,28,46,'#745660');for(let i=0;i<4;i++)curve(()=>{let y=18+i*19;c.moveTo(-29,y);c.quadraticCurveTo(0,y+11,29,y)},'#443841',3);
// thorax connects head / wings / legs
ellipse(0,-7,43,49,'#3c3a43','#272931',3);ellipse(-12,-20,24,24,'#4b4651');ellipse(15,-18,20,24,'#45414d');
// head nod on a stable neck joint
c.save();c.translate(0,-47);c.rotate(Math.sin(t*.75)*.016+Math.sin(t*1.4)*motion*.012);
ellipse(0,-20,50,44,'#45404a','#292934',3);
// antennae are flexible, not moving the entire head
for(let sign of [-1,1])curve(()=>{c.moveTo(sign*20,-48);c.quadraticCurveTo(sign*25,-68,sign*(38+Math.sin(t*2+sign)*3),-72)},'#332f37',3);
// red compound eyes, pupils and lids are same rig: no superimposed original eyes
const blink=blinkBoost>.3?Math.max(0,1-Math.abs(Math.sin(t*11))*.95):Math.pow(Math.max(0,Math.sin(t*.81+1.5)),34),lookX=Math.sin(t*1.13)*4,lookY=Math.sin(t*.71)*2.2;
for(let sign of [-1,1]){const x=sign*23,y=-25;ellipse(x,y,24,27,'#742b3c','#2d2530',2.5);ellipse(x,y-1,20,23,'#db4c58');ellipse(x-5,y-9,9,7,'#f4898b88');c.save();c.beginPath();c.ellipse(x,y-1,19,22,0,0,TAU);c.clip();ellipse(x+lookX,y+lookY-2,11,13,'#fff8e9');ellipse(x+lookX+sign*2,y+lookY-1,6,8,'#302a36');ellipse(x+lookX+sign*1,y+lookY-5,2.8,3,'#ffffff');if(blink>.03){c.fillStyle='#ba4350';c.fillRect(x-24,y-26,48,52*blink)}c.restore();curve(()=>{c.moveTo(x-13,y-24);c.quadraticCurveTo(x,y-29-sign*Math.sin(t*1.2)*2,x+12,y-24)},'#512a37',2.4)}
// smile independently changes shape with gaze
c.fillStyle='#251e2a';c.beginPath();c.ellipse(0,14,11,5+Math.sin(t*.85)*1.1,0,0,Math.PI);c.fill();ellipse(0,18,6,2,'#dd8187');c.restore();c.restore();
// clean HP bar below insect, out of head / eye / wing area
const bw=clamp(105*scale,64,135),barY=fly.y+scale*123;c.fillStyle='#2f2833';c.beginPath();c.roundRect(fly.x-bw/2-3,barY-3,bw+6,14,7);c.fill();c.fillStyle='#37d67b';c.beginPath();c.roundRect(fly.x-bw/2,barY,bw,8,4);c.fill()}
function loop(ms){if(!prev)prev=ms;const dt=Math.min(.04,(ms-prev)/1000);prev=ms;update(dt);background();flyCharacter();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script></body></html>
