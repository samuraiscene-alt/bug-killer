<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#29202b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bug Killer"><title>Bug Killer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18151c;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}header{position:fixed;inset:env(safe-area-inset-top) 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 18px;pointer-events:none;text-shadow:0 2px 5px #47342a}header b{font-size:clamp(18px,3vw,29px);letter-spacing:1px}header b span{color:#ffd15b}header small{font-size:10px;letter-spacing:2px;display:block}header .stats{font-weight:900;font-size:21px}header .stats small{display:inline;font-size:12px;margin-right:9px}#hint{position:fixed;top:15%;width:100%;text-align:center;color:#594534;font-weight:700;pointer-events:none;font-size:clamp(11px,2vw,15px)}#weapons{position:fixed;bottom:max(env(safe-area-inset-bottom),8px);left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px;border:1px solid #ffffff33;background:#1c1925e6;border-radius:16px;box-shadow:0 8px 25px #0007}button{font:inherit;cursor:pointer} .weapon{display:flex;align-items:center;gap:8px;color:#fff;background:#38303c;border:1px solid #706774;border-radius:11px;padding:8px 14px;min-width:105px;font-weight:800;white-space:nowrap}.weapon:active{transform:scale(.94)}.weapon strong{font-size:27px}.weapon small{display:block;font-size:10px;color:#decdb2;font-weight:500}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#19121cc9}#overlay.hide{display:none}.panel{text-align:center;background:#28222fee;padding:28px 42px;border:2px solid #e6b45c;border-radius:22px;box-shadow:0 20px 80px #0008}.panel h1{font-size:clamp(30px,6vw,65px);margin:0;color:#ffce4a}.panel p{color:#e8d8c3}.panel button{border:0;border-radius:10px;background:#ffcc54;color:#38291e;padding:12px 34px;font-size:19px;font-weight:900}#rotate{display:none;position:fixed;inset:0;background:#201b26;z-index:10;place-items:center;text-align:center;padding:30px;font-size:22px;font-weight:800}@media(orientation:portrait){#rotate{display:grid}}@media(max-height:390px){.weapon{padding:4px 9px}.weapon strong{font-size:20px}header{padding:3px 13px}}
</style></head><body><canvas id="game"></canvas><header><div><b>BUG <span>KILLER</span></b><small>INSECT HUNT · v0.1.0</small></div><div class="stats"><small>점수</small><span id="score">0000</span>　<small>시간</small><span id="time">60</span></div></header><div id="hint">벌레를 터치한 뒤 무기를 선택하세요</div><div id="weapons"><button class="weapon" data-kind="paper"><strong>📰</strong><div>신문지<small id="paperTxt">멀쩡함</small></div></button><button class="weapon" data-kind="swatter"><strong>🏓</strong><div>파리채<small>항상 일정</small></div></button><button class="weapon" data-kind="spray"><strong>🧴</strong><div>스프레이<small id="sprayTxt">100%</small></div></button></div><div id="overlay"><div class="panel"><h1>BUG KILLER</h1><p id="message">벌레를 지정하고 무기로 공격하세요!</p><button id="start">게임 시작</button></div></div><div id="rotate">↻<br>아이폰을 가로로 돌려주세요</div>
<script>
(()=>{
'use strict';
const el=id=>document.getElementById(id),canvas=el('game'),ctx=canvas.getContext('2d');
let W=1,H=1,scale=1,mode='ready',bugs=[],fx=[],shots=[],target=null,score=0,seconds=60,used=0,spray=100,last=0,elapsed=0,spawn=0,id=0;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){W=innerWidth;H=innerHeight;scale=Math.min(devicePixelRatio||1,2);canvas.width=W*scale;canvas.height=H*scale;ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();
const info={fly:{hp:66,v:140,points:100},mosquito:{hp:48,v:94,points:130},roach:{hp:135,v:77,points:180}};
function bug(type){let size=rnd(.65,1.42),hp=Math.round(info[type].hp*size);return{id:++id,type,x:rnd(48,W-48),y:rnd(92,H-110),size,hp,max:hp,dx:rnd(-1,1),dy:rnd(-1,1),phase:rnd(0,7),depth:type==='roach'?0:rnd(0,.7),turn:rnd(.5,2),dead:0,vy:0,angle:0}}
function init(){mode='play';score=0;seconds=60;used=0;spray=100;elapsed=0;spawn=0;bugs=[];fx=[];shots=[];target=null;for(let i=0;i<Math.min(12,Math.max(6,Math.round(W/110)));i++)bugs.push(bug(['fly','mosquito','roach'][i%3]));el('overlay').classList.add('hide');hud()}
function hud(){el('score').textContent=String(score).padStart(4,'0');el('time').textContent=String(Math.max(0,Math.ceil(seconds)));el('sprayTxt').textContent=Math.round(spray)+'%';el('paperTxt').textContent=used<3?'멀쩡함':used<7?'약간 구김':used<13?'많이 구김':'심하게 구김'}
function spark(x,y,col,n=10){for(let i=0;i<n;i++){let a=rnd(0,7),s=rnd(30,160);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:rnd(.2,.8),full:.8,col,r:rnd(1,4)})}}
function hurt(b,d){if(b.hp<=0)return;b.hp=Math.max(0,b.hp-d);spark(b.x,b.y,b.hp?'#f2c04b':'#b8754a',b.hp?5:22);if(b.hp===0){b.dead=0.001;b.vy=-70;score+=info[b.type].points;b.angle=rnd(-.8,.8);hud()}}
function fire(kind){if(mode!=='play'||!target)return;if(kind==='spray'&&spray<1)return;const x=target.x,y=target.y,r={paper:34,swatter:70,spray:132}[kind]*clamp(W/920,.8,1.3);let damage={paper:38,swatter:78,spray:120}[kind];if(kind==='paper')used++;if(kind==='spray'){damage*=.25+.75*spray/100;spray=Math.max(0,spray-12)}shots.push({kind,x,y,r,damage,t:0,hit:new Set(),done:false});target=null;hud()}
document.querySelectorAll('.weapon').forEach(b=>b.addEventListener('click',()=>fire(b.dataset.kind)));
canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;let x=e.clientX,y=e.clientY,nearest=null,min=1e9;for(const b of bugs){if(b.hp<=0)continue;let d=Math.hypot(x-b.x,y-b.y);if(d<42*b.size&&d<min){nearest=b;min=d}}target={x:nearest?nearest.x:x,y:nearest?nearest.y:y};spark(target.x,target.y,'#ffdf76',4)});
el('start').onclick=init;
function update(dt){if(mode!=='play')return;elapsed+=dt;seconds-=dt;spawn+=dt;if(seconds<=0){seconds=0;mode='end';el('message').textContent='최종 점수 '+score+'점';el('start').textContent='다시 시작';el('overlay').classList.remove('hide')}if(spawn>2.4&&bugs.filter(b=>b.hp>0).length<Math.min(22,W/46)){spawn=0;bugs.push(bug(['fly','mosquito','roach'][Math.floor(rnd(0,3))]))}
for(const b of bugs){if(b.hp<=0){b.dead+=dt;b.vy+=600*dt;b.y+=b.vy*dt;b.angle+=dt*3;continue}b.phase+=dt*(b.type==='fly'?14:b.type==='mosquito'?9:5);b.turn-=dt;let status=b.hp/b.max,factor=status<=.35?.34:status<=.7?.68:1;if(b.turn<=0){let a=rnd(-3.14,3.14);b.dx=Math.cos(a);b.dy=Math.sin(a);b.turn=rnd(.4,1.7)}let v=info[b.type].v*factor;b.x+=(b.dx*v+(b.type==='roach'?0:Math.sin(b.phase)*14))*dt;b.y+=(b.dy*v+(b.type==='roach'?0:Math.cos(b.phase*.7)*12))*dt;if(b.x<25||b.x>W-25)b.dx*=-1;if(b.y<75||b.y>H-85)b.dy*=-1;b.x=clamp(b.x,25,W-25);b.y=clamp(b.y,75,H-85)}
bugs=bugs.filter(b=>b.hp>0||b.y<H+70);
for(const s of shots){s.t+=dt;if(s.kind==='spray'){if(s.t>.16&&s.t<1.05){let radius=s.r*clamp((s.t-.1)/.5,.1,1);for(const b of bugs)if(b.hp>0&&!s.hit.has(b.id)&&Math.hypot(b.x-s.x,b.y-s.y)<radius+12*b.size){s.hit.add(b.id);hurt(b,Math.round(s.damage))}}}else if(!s.done&&s.t>.22){s.done=true;spark(s.x,s.y,'#ffcb66',18);for(const b of bugs)if(b.hp>0&&Math.hypot(b.x-s.x,b.y-s.y)<s.r+12*b.size)hurt(b,Math.round(s.damage))}}
shots=shots.filter(s=>s.t<(s.kind==='spray'?1.2:.7));for(const p of fx){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}fx=fx.filter(p=>p.t>0);hud()}
function line(points,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
function oval(x,y,rx,ry,col,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function star(x,y,r){ctx.beginPath();for(let k=0;k<10;k++){let a=k*Math.PI/5-Math.PI/2,p=k%2?r*.48:r;k?ctx.lineTo(x+Math.cos(a)*p,y+Math.sin(a)*p):ctx.moveTo(x+Math.cos(a)*p,y+Math.sin(a)*p)}ctx.closePath();ctx.fillStyle='#ffd047';ctx.fill();ctx.strokeStyle='#765024';ctx.lineWidth=1;ctx.stroke()}
function insect(b){let dead=b.hp<=0,sz=b.size*(1+b.depth*.25)*clamp(W/1000,.7,1.15);ctx.save();ctx.globalAlpha=dead?.1:.22;oval(b.x+10+b.depth*26,b.y+18+b.depth*30,22*sz,7*sz,'#554436');ctx.restore();ctx.save();ctx.translate(b.x,b.y);ctx.rotate(dead?b.angle:Math.sin(b.phase)*.09);ctx.scale(sz,sz);
const roach=b.type==='roach',mos=b.type==='mosquito',wing=Math.sin(b.phase*2.7);for(let j=-1;j<=1;j++){let yy=j*9;line([[-8,yy],[-22,yy+5],[-26,yy+12]],'#563c36',2);line([[8,yy],[22,yy+5],[26,yy+12]],'#563c36',2)}
if(!roach){ctx.globalAlpha=.8;ctx.save();ctx.translate(-10,-12);ctx.rotate(-.6+wing*.18);oval(0,-7,9,21,'#cae8f0','#7798a3');ctx.restore();ctx.save();ctx.translate(10,-12);ctx.rotate(.6-wing*.18);oval(0,-7,9,21,'#cae8f0','#7798a3');ctx.restore();ctx.globalAlpha=1}
oval(0,9,roach?19:11,roach?26:16,roach?'#a65c31':mos?'#ac4a4e':'#53474d','#3a2d31');oval(0,-12,roach?15:13,roach?14:13,roach?'#70402a':mos?'#755257':'#3d3b44','#382c31');
if(b.type==='fly'){oval(-7,-14,7,9,'#e4514d');oval(7,-14,7,9,'#e4514d')}else{oval(-6,-15,6,7,'#f9edcf');oval(6,-15,6,7,'#f9edcf')}
if(dead){ctx.fillStyle='#3f2b2d';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('× ×',0,-9);ctx.strokeStyle='#fbd65a';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-40,14,5,0,0,6.3);ctx.stroke();if(mos)line([[0,-20],[3,-33],[12,-27],[17,-38]],'#5b3635',3);if(roach){line([[-10,13],[0,21],[10,12]],'#ec9a49',4);star(0,17,10)}if(b.type==='fly'){ctx.scale(1.15,.7)}}else{oval(-5,-14,2.5,3,'#251b22');oval(5,-14,2.5,3,'#251b22')}
if(mos&&!dead)line([[0,-21],[0,-33],[3,-44]],'#5f3c3b',2.4);
if(roach){line([[-5,-23],[-18,-46]],'#624235',2);line([[5,-23],[18,-46]],'#624235',2)}
let ratio=b.hp/b.max;if(!dead&&ratio<=.7){for(let k=0;k<3;k++){let a=elapsed*4+k*2.09;star(Math.cos(a)*15,-31+Math.sin(a)*5,4)}}if(!dead&&ratio<=.35){ctx.fillStyle='#f1d5ab';ctx.strokeStyle='#8e705c';ctx.lineWidth=1;ctx.fillRect(-9,6,18,8);ctx.strokeRect(-9,6,18,8);ctx.fillStyle='#ad9078';ctx.fillRect(-2,6,4,8)}ctx.restore();
if(!dead){let w=clamp(43*sz,27,68),x=b.x-w/2,y=b.y-46*sz,ratio=b.hp/b.max;ctx.fillStyle='#362c32';ctx.fillRect(x-2,y-2,w+4,10);ctx.fillStyle='#6d6367';ctx.fillRect(x,y,w,6);ctx.fillStyle=ratio>.7?'#42d979':ratio>.35?'#f7ca39':'#ef5151';ctx.fillRect(x,y,w*ratio,6)}}
function draw(){const gradient=ctx.createLinearGradient(0,0,W,H);gradient.addColorStop(0,'#e8d5b6');gradient.addColorStop(1,'#c6a882');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#947c5b35';ctx.lineWidth=2;for(let x=0;x<W;x+=W/6){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=50;y<H;y+=110){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#856446';ctx.fillRect(0,H-32,W,32);ctx.fillStyle='#ac8b65';ctx.fillRect(0,H-35,W,6);
for(const b of bugs)insect(b);
if(target){ctx.save();ctx.strokeStyle='#ffcf54';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.arc(target.x,target.y,28,0,6.283);ctx.stroke();ctx.restore()}
for(const s of shots){let p=clamp(s.t/(s.kind==='spray'?.9:.42),0,1);ctx.save();if(s.kind==='spray'){let rad=s.r*clamp((s.t-.1)/.5,0,1);let g=ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,Math.max(rad,5));g.addColorStop(0,'#c5f9e4cb');g.addColorStop(1,'#a0e5c500');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,rad,0,6.28);ctx.fill()}else if(p>.5){ctx.strokeStyle=s.kind==='paper'?'#fff3b2':'#ff9d5d';ctx.globalAlpha=1-p;ctx.lineWidth=7;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.4+p*.6),0,6.28);ctx.stroke()}ctx.globalAlpha=p>.8?1-(p-.8)/.2:1;ctx.translate(s.x+W*.3*(1-Math.min(1,p*3)),s.y+H*.3*(1-Math.min(1,p*3)));ctx.rotate(-.7+p*.9);if(s.kind==='paper'){ctx.fillStyle='#eee2bc';ctx.strokeStyle='#554a43';ctx.lineWidth=3;ctx.fillRect(-16,-64,42,88);ctx.strokeRect(-16,-64,42,88);ctx.strokeStyle='#9e9582';for(let i=0;i<6;i++)line([[-9,-53+i*11],[17,-50+i*11]],'#9e9582',1);for(let i=0;i<Math.min(used,16);i++)line([[-15+i%4*8,-40+i*4],[-10+i%4*8,-29+i*4]],'#ad947e',1)}
else if(s.kind==='swatter'){ctx.fillStyle='#e4695b';ctx.strokeStyle='#803f42';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-27,-71,54,62,8);ctx.fill();ctx.stroke();for(let i=-19;i<25;i+=10)line([[i,-64],[i,-14]],'#ffd8c1',1);for(let i=-60;i<-10;i+=10)line([[-23,i],[23,i]],'#ffd8c1',1);ctx.fillStyle='#d59683';ctx.fillRect(-4,-9,8,82)}
else{ctx.fillStyle='#4bc29f';ctx.strokeStyle='#24584d';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-19,-40,38,68,8);ctx.fill();ctx.stroke();ctx.fillStyle='#eee9d8';ctx.fillRect(-12,-19,24,36);ctx.fillStyle='#3a6052';ctx.fillRect(-7,-49,14,9)}ctx.restore()}
for(const p of fx){ctx.globalAlpha=clamp(p.t/p.full,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}ctx.globalAlpha=1}
function frame(t){if(!last)last=t;let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){mode='pause';el('message').textContent='게임 일시정지 · 다시 시작할 수 있어요';el('start').textContent='다시 시작';el('overlay').classList.remove('hide')}});
})();
</script></body></html>
