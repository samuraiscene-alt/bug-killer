<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#241f25"><title>Bug Killer · Fly Animation Lab v0.2</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#201b24;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:10px 18px;pointer-events:none;text-shadow:0 2px 6px #0009}.brand{font-size:clamp(18px,3vw,30px);font-weight:1000;letter-spacing:1px}.brand span{color:#ffce6d}.sub{color:#fffdd2;font-size:10px;letter-spacing:1px}.right{text-align:right}.right b{font-size:14px;color:#ffce6d}.right small{display:block;font-size:10px;color:#fffdd2}.controls{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;background:#241c2de8;border:1px solid #ffffff38;padding:7px;border-radius:17px;white-space:nowrap}button{background:#43364b;color:white;border:1px solid #796582;font:700 clamp(10px,1.8vw,13px) system-ui;padding:11px clamp(7px,1.6vw,15px);border-radius:10px}button.active{background:#ffdc75;color:#36291f}.message{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#312536cf;padding:6px 13px;border-radius:13px;font-size:clamp(11px,1.9vw,15px);white-space:nowrap}.rotate{display:none;position:fixed;inset:0;background:#231a29;z-index:5;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px}@media(orientation:portrait){.rotate{display:flex}}@media(max-height:380px){button{padding:7px 9px}}
</style></head><body><canvas id="scene"></canvas><div class="hud"><div><div class="brand">BUG <span>KILLER</span></div><div class="sub">FLY ANIMATION TEST · v0.2.0</div></div><div class="right"><b id="phase">정지 · 벽에 붙은 상태</b><small id="fps">파리 1마리 테스트</small></div></div><div class="message" id="message">파리 이륙·비행·착지·부상을 확인하세요</div><div class="controls"><button id="auto">▶ 전체 시연</button><button id="fly">🪽 날기</button><button id="light">⭐ 경상</button><button id="heavy">🩹 중상</button><button id="dead">✕ 사망</button><button id="reset">↻ 초기화</button></div><div class="rotate">↻<br>아이폰을 가로로 돌려주세요</div><script src="app.js"></script></body></html>
