function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);c.setTransform(DPR,0,0,DPR,0,0);if(!sx){sx=W*.43;sy=H*.55;flyX=sx;flyY=sy}}window.addEventListener('resize',resize);resize();
function status(s){$('phase').textContent=s;}
function setMessage(s){$('message').textContent=s}
function buttonOn(id){document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',b.id===id))}
function reset(){elapsed=0;mode='idle';state=0;depth=0;flutter=0;auto=false;timer=0;flyX=W*.43;flyY=H*.56;sx=flyX;sy=flyY;vx=0;vy=0;rot=0;fallY=0;fallV=0;particles=[];confetti=[];status('정상 · 벽에 붙은 상태');setMessage('파리가 벽에 붙어 있어요. 날기 버튼을 눌러보세요.');buttonOn('reset')}
function fly(){if(state===3)return;mode='takeoff';timer=0;boost=0;status('이륙 준비');setMessage('날개 떨림 → 벽에서 이륙 → 공중비행 → 다시 착지');buttonOn('fly')}
function injury(s){if(state===3)return;state=s;mode='hurt';timer=0;boost=.8;spawn(s===1?9:18,s===1?'#ffdc65':'#ff9465');status(s===1?'경상 · 헤롱헤롱':'중상 · 반창고 + 별');setMessage(s===1?'경상: 별이 돌고 비행이 불안정해져요':'중상: 몸통 반창고 + 별, 비행이 크게 둔해져요');buttonOn(s===1?'light':'heavy')}
function kill(){state=3;mode='dead';timer=0;fallY=0;fallV=-92;rot=0;boost=1;spawn(38,'#e79b70');status('사망 · 추락 중');setMessage('엔젤링 + X눈 + 몸통 찌그러짐 + 벽에서 떨어짐');buttonOn('dead')}
function spawn(n,color){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=35+Math.random()*140;particles.push({x:flyX,y:flyY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:.3+Math.random()*.75,max:1,r:2+Math.random()*4,col:color})}}
$('auto').onclick=()=>{reset();auto=true;fly();buttonOn('auto');status('전체 애니메이션 시연');setMessage('이륙 → 비행 → 착지 → 경상 → 중상 → 사망')};$('fly').onclick=()=>{auto=false;fly()};$('light').onclick=()=>{auto=false;injury(1)};$('heavy').onclick=()=>{auto=false;injury(2)};$('dead').onclick=()=>{auto=false;kill()};$('reset').onclick=reset;
function update(dt){now+=dt;elapsed+=dt;timer+=dt;for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
const factor=state===2?.4:state===1?.72:1;
if(mode==='takeoff'){let a=clamp(timer/.85,0,1);depth=a*.85;flyY=sy-mix(0,H*.16,a);flyX=sx+Math.sin(timer*9)*4;flutter=1;status('파리 이륙');if(timer>.85){mode='air';timer=0;vx=0;vy=0}}
else if(mode==='air'){depth=.66+.18*Math.sin(now*2);let tx=W*(.55+.25*Math.sin(now*1.12)),ty=H*(.39+.19*Math.sin(now*1.45));vx+=(tx-flyX)*4*dt;vy+=(ty-flyY)*4*dt;vx*=Math.exp(-3.2*dt);vy*=Math.exp(-3.2*dt);flyX+=vx*dt*factor*2.5;flyY+=vy*dt*factor*2.5;flutter=1;status('공중 비행 · 날개 떨림');if(timer>(state===2?2.1:3.2)){mode='landing';timer=0;sx=flyX;sy=flyY}}
else if(mode==='landing'){let a=clamp(timer/1,0,1),e=a*a*(3-2*a);flyX=mix(sx,W*.43,e);flyY=mix(sy,H*.56,e);depth=mix(depth,0,e);flutter=1-a;status('벽에 다시 착지');if(timer>=1){mode='idle';timer=0;flutter=0;sx=flyX;sy=flyY}}
else if(mode==='hurt'){flutter=state===2?.32:.65;flyX+=Math.sin(now*14)*dt*9;flyY+=Math.cos(now*9)*dt*5;status(state===1?'경상 · 비틀거림':'중상 · 느린 날갯짓');if(timer>1.7){mode=state===2?'landing':'air';timer=0;sx=flyX;sy=flyY}}
else if(mode==='dead'){fallV+=720*dt;fallY+=fallV*dt;rot=0;flutter=0;depth=0;if(flyY+fallY>H-78){fallY=H-78-flyY;fallV=0;mode='floor';timer=0;spawn(12,'#ba6c62');status('사망 · 바닥에 떨어짐')}}
else if(mode==='floor'){status('사망 · 바닥에 떨어짐')}
else{flutter*=.85;flyX=mix(flyX,W*.43,.07);flyY=mix(flyY,H*.56,.07);depth*=.9}
if(auto){if(elapsed>6&&state===0){auto=2;injury(1)}if(elapsed>8.5&&state===1){auto=2;injury(2)}if(elapsed>11&&state===2){auto=false;kill()}}
$('fps').textContent='원본 B안 일러스트 · '+names[state]+' 상태';}
function oval(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function bg(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e7d6ba');g.addColorStop(.72,'#d7be9b');g.addColorStop(1,'#bfa080');c.fillStyle=g;c.fillRect(0,0,W,H);c.strokeStyle='#bba28262';c.lineWidth=2;for(let x=-W*.15;x<W*1.25;x+=W*.4){c.beginPath();c.moveTo(x,0);c.lineTo(x,H-39);c.stroke()}let wall=c.createRadialGradient(W*.57,H*.35,15,W*.57,H*.35,W*.65);wall.addColorStop(0,'#fff1d63d');wall.addColorStop(1,'#80573014');c.fillStyle=wall;c.fillRect(0,0,W,H);c.strokeStyle='#c3aa8b77';c.lineWidth=1.5;c.beginPath();c.moveTo(0,H*.71);c.lineTo(W,H*.71);c.stroke();c.fillStyle='#a17d5d';c.fillRect(0,H-43,W,43);c.fillStyle='#e1c8a3';c.fillRect(0,H-47,W,6);c.fillStyle='#73563f';c.fillRect(0,H-12,W,12);
for(let k=0;k<25;k++){let x=(k*137.7+21)%W,y=(k*61.83)%(H-55);c.fillStyle='#9a78530e';c.beginPath();c.arc(x,y,2+k%4,0,6.28);c.fill()}}
function wings(x,y,s){let flutterPhase=Math.sin(now*61),swing=.2+Math.abs(flutterPhase)*.8;c.save();c.translate(x,y);c.globalAlpha=.25+Math.abs(flutterPhase)*.17;c.fillStyle='#d3f5ff';c.strokeStyle='#83b9cc';c.lineWidth=1.3;for(let dir of [-1,1]){c.save();c.rotate(dir*(.37+flutterPhase*.24));c.beginPath();c.ellipse(dir*26*s,-67*s,23*s,46*s,dir*.2,0,6.28);c.fill();c.stroke();c.restore()}c.restore()}

function path(points,col,width){c.strokeStyle=col;c.lineWidth=width;c.lineJoin='round';c.lineCap='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
function wing(dir,beat,damaged){c.save();c.translate(dir*24,-20);c.rotate(dir*(.7+beat*.65));c.globalAlpha=.88;c.fillStyle='#c6e6ee';c.strokeStyle='#627f99';c.lineWidth=2.8;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(dir*23,-47,dir*54,-93,dir*77,-69);c.bezierCurveTo(dir*95,-34,dir*47,2,0,0);c.closePath();c.fill();c.stroke();path([[0,0],[dir*42,-42],[dir*73,-62]],'#86a5b6',1.3);path([[dir*26,-20],[dir*67,-46]],'#86a5b6',1.1);if(damaged){path([[dir*66,-48],[dir*56,-59],[dir*67,-68]],'#627f99',2.5)}c.restore()}
function articulatedLeg(side,index,t,flight,dead,weak){
const hipX=side*(20+index*2),hipY=-4+index*15;
const a=side*(33+index*5),restY=27+index*14;
let kneeX=a,kneeY=hipY+15,footX=side*(48+index*7),footY=restY+20;
if(flight){
 const v=Math.sin(t*7+index+side)*.8;
 kneeX=side*(33+index*4)+v;kneeY=hipY+22;
 footX=side*(34+index*4)+v*1.1;footY=hipY+39;
}else if(dead){kneeX=side*(38+index*4);kneeY=hipY+19;footX=side*(43+index*4);footY=hipY+35;}
else{
 const p=Math.sin(t*(weak?2.2:3.8)+index*Math.PI+(side>0?Math.PI:0));
 kneeX=a+side*p*(weak?1.3:3.2);kneeY=hipY+18;
 footX=side*(48+index*7)+p*(weak?1.5:4.3);
 footY=restY+20-Math.max(0,p)*(weak?1.5:3.3);
}
path([[hipX,hipY],[kneeX,kneeY],[footX,footY]],'#332a33',5);
path([[hipX,hipY],[kneeX,kneeY],[footX,footY]],'#765b66',2);
oval(kneeX,kneeY,3.1,3.1,'#46353e')
}
function starShape(x,y,r){c.fillStyle='#ffd447';c.strokeStyle='#7a4b2f';c.lineWidth=1.8;c.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,q=i%2?r*.43:r;i?c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):c.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill();c.stroke()}
function flyDraw(){
const dead=state===3,fall=mode==='dead'||mode==='floor';
const s=clamp(Math.min(W/920,H/520)*1.35*(1+depth*.25),.58,1.23);
const px=flyX,py=flyY+fallY,beat=(mode==='air'||mode==='takeoff'||mode==='landing'||mode==='hurt')?Math.sin(now*(state===2?24:50))*.65:Math.sin(now*5)*.055;
const shake=!dead&&state?Math.sin(now*(state===2?11:16))*(state===2?2:1.3):0;
c.save();c.globalAlpha=fall?.12:clamp(.25-depth*.2,.06,.24);oval(px+depth*29,flyY+91+depth*40,51*s,11*s,'#4b3c36');c.restore();
c.save();c.translate(px+shake,py+(!fall?Math.sin(now*9)*flutter*2:0));c.scale(s,s);
if(fall){c.translate(0,Math.min(20,Math.max(0,fallY)*.05));} // no rotation on death
// Six independent joints with an alternating tripod walking gait
const airborne=mode==='takeoff'||mode==='air'||(mode==='landing'&&timer<.9)||(mode==='hurt'&&depth>.12);
for(let side of [-1,1])for(let i=0;i<3;i++)articulatedLeg(side,i,now,airborne,dead,state===2);
// The two wings flap independently, not part of a moving still photograph
wing(-1,beat,dead||state===2);wing(1,-beat,dead||state===2);
oval(0,20,40,59,dead?'#464049':'#4b414b','#302a32');
oval(-12,20,17,48,'#554954');oval(11,21,17,46,'#63525a');
for(let i=0;i<4;i++)path([[-28,7+i*18],[28,7+i*18]],'#342d35',1.5);
oval(0,-34,43,37,dead?'#433940':'#4d424a','#2c2931');
// Head is a clipped independent piece from the approved B-style original
const img=imgs[state];
if(img&&img.complete&&img.naturalWidth){
c.save();c.beginPath();c.ellipse(0,-56,61,55,0,0,Math.PI*2);c.clip();
c.drawImage(img,73,116,166,134,-62,-111,124,106);
c.restore();
}
// Independently animated antennae
for(let dir of [-1,1]){const motion=!dead?Math.sin(now*4+dir)*5:0;path([[dir*15,-102],[dir*(25+motion*.3),-115],[dir*(34+motion),-119]],'#332a30',3)}
// Eyes and facial expressions animate independently from static art
if(!dead){
 const lookX=Math.sin(now*1.55)*5,lookY=Math.sin(now*.93)*2.5;
 const blinking=(Math.sin(now*2.45)>.965);
 for(let side of [-1,1]){
  const ex=side*23,ey=-66;
  oval(ex,ey,19,22,'#a93243');
  oval(ex,ey-2,16,18,'#e6535b');
  if(blinking){path([[ex-12,ey],[ex+12,ey]],'#422a38',5)}
  else{
   oval(ex+lookX*.48,ey-3+lookY,10,12,'#fff2e7');
   oval(ex+lookX*.68,ey-2+lookY,5.8,7,'#29222a');
   oval(ex+lookX*.68-1.5,ey-4+lookY,2,2.5,'#ffffff');
  }
 }
 if(state===0){
  c.fillStyle='#33212a';c.beginPath();c.ellipse(0,-38,11,5,0,0,Math.PI);c.fill();
  c.fillStyle='#e98b91';c.beginPath();c.ellipse(0,-34,5,2,0,0,Math.PI);c.fill();
 }else{
  oval(0,-36,8,state===2?8:5,'#3d2730');
  oval(1,-31,4,3,'#f0839a');
 }
}
if(state===2&&!dead){c.save();c.rotate(.15);c.fillStyle='#ead1a4';c.strokeStyle='#a78c70';c.lineWidth=1.5;c.beginPath();c.roundRect(-24,13,47,17,5);c.fill();c.stroke();for(let i=0;i<4;i++)oval(-15+i*10,21,1.3,1.3,'#a88162');c.restore()}
if(state>0&&!dead){for(let i=0;i<3;i++){let a=now*2.6+i*2.094;starShape(Math.cos(a)*44,-139+Math.sin(a)*11,state===1?7:8)}}
if(dead){c.strokeStyle='#ffd857';c.lineWidth=5;c.beginPath();c.ellipse(0,-133,28,8,-.12,0,Math.PI*2);c.stroke();path([[-24,-70],[-9,-55]],'#342b32',5);path([[-9,-70],[-24,-55]],'#342b32',5);path([[12,-70],[27,-55]],'#342b32',5);path([[27,-70],[12,-55]],'#342b32',5)}
c.restore();
// HP below character, outside independently moving legs, wings and head effects
if(!dead){let ratio=state===0?1:state===1?.62:.26,w=clamp(98*s,55,112),x=px-w/2,y=py+clamp(110*s,70,127);c.fillStyle='#262129';c.beginPath();c.roundRect(x-3,y-3,w+6,14,6);c.fill();c.fillStyle='#80777c';c.fillRect(x,y,w,8);c.fillStyle=state===0?'#35db7b':state===1?'#ffd04b':'#f2525b';c.beginPath();c.roundRect(x,y,Math.max(2,w*ratio),8,3);c.fill()}
}
function render(){bg();flyDraw();for(let p of particles){c.globalAlpha=clamp(p.life/p.max,0,1);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,6.28);c.fill()}c.globalAlpha=1}
function loop(ms){if(!last)last=ms;let dt=Math.min(.035,(ms-last)/1000);last=ms;update(dt);render();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script>
